<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LoRa Test Dashboard</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            color: #fff;
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        
        header {
            text-align: center;
            margin-bottom: 30px;
        }
        
        h1 {
            font-size: 2rem;
            margin-bottom: 10px;
            color: #00d9ff;
        }
        
        .status-bar {
            display: flex;
            justify-content: center;
            gap: 30px;
            flex-wrap: wrap;
        }
        
        .status-item {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.9rem;
        }
        
        .status-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            animation: pulse 2s infinite;
        }
        
        .status-dot.connected { background: #00ff88; }
        .status-dot.disconnected { background: #ff4444; }
        .status-dot.connecting { background: #ffaa00; }
        
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        
        .config-panel {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
        }
        
        .config-row {
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
        }
        
        .config-row label {
            font-size: 0.9rem;
            color: #aaa;
        }
        
        .config-row input {
            flex: 1;
            min-width: 200px;
            padding: 10px 15px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 8px;
            background: rgba(0, 0, 0, 0.3);
            color: #fff;
            font-size: 1rem;
        }
        
        .config-row button {
            padding: 10px 25px;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .btn-connect {
            background: #00d9ff;
            color: #1a1a2e;
        }
        
        .btn-disconnect {
            background: #ff4444;
            color: #fff;
        }
        
        .btn-connect:hover { background: #00f5ff; }
        .btn-disconnect:hover { background: #ff6666; }
        
        .panels {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
        }
        
        .panel {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            padding: 20px;
        }
        
        .panel h2 {
            font-size: 1.1rem;
            color: #00d9ff;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
        }
        
        .stat-card {
            background: rgba(0, 0, 0, 0.2);
            border-radius: 8px;
            padding: 15px;
            text-align: center;
        }
        
        .stat-value {
            font-size: 1.8rem;
            font-weight: bold;
            color: #00d9ff;
        }
        
        .stat-label {
            font-size: 0.8rem;
            color: #888;
            margin-top: 5px;
        }
        
        .rssi-meter {
            height: 20px;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 10px;
            overflow: hidden;
            margin: 10px 0;
        }
        
        .rssi-bar {
            height: 100%;
            transition: width 0.3s, background 0.3s;
            border-radius: 10px;
        }
        
        .rssi-bar.excellent { background: linear-gradient(90deg, #00ff88, #00d9ff); }
        .rssi-bar.good { background: linear-gradient(90deg, #88ff00, #00ff88); }
        .rssi-bar.fair { background: linear-gradient(90deg, #ffaa00, #88ff00); }
        .rssi-bar.poor { background: linear-gradient(90deg, #ff4444, #ffaa00); }
        
        .reading-list {
            max-height: 400px;
            overflow-y: auto;
        }
        
        .reading-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 8px;
            margin-bottom: 8px;
            animation: slideIn 0.3s ease;
        }
        
        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .reading-info {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        
        .reading-tag {
            font-weight: bold;
            color: #00d9ff;
        }
        
        .reading-time {
            font-size: 0.8rem;
            color: #888;
        }
        
        .reading-rssi {
            font-size: 1.2rem;
            font-weight: bold;
        }
        
        .reading-rssi.excellent { color: #00ff88; }
        .reading-rssi.good { color: #88ff00; }
        .reading-rssi.fair { color: #ffaa00; }
        .reading-rssi.poor { color: #ff4444; }
        
        .log-panel {
            font-family: 'Consolas', 'Monaco', monospace;
            font-size: 0.85rem;
            max-height: 200px;
            overflow-y: auto;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 8px;
            padding: 10px;
        }
        
        .log-entry {
            padding: 4px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }
        
        .log-entry.error { color: #ff4444; }
        .log-entry.warn { color: #ffaa00; }
        .log-entry.info { color: #00d9ff; }
        
        ::-webkit-scrollbar {
            width: 8px;
        }
        
        ::-webkit-scrollbar-track {
            background: rgba(0, 0, 0, 0.2);
            border-radius: 4px;
        }
        
        ::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 4px;
        }
        
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 255, 255, 0.3);
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🛰️ LoRa Test Dashboard</h1>
            <div class="status-bar">
                <div class="status-item">
                    <div class="status-dot disconnected" id="statusDot"></div>
                    <span id="statusText">Disconnected</span>
                </div>
                <div class="status-item">
                    <span>📊 Readings: <strong id="totalReadings">0</strong></span>
                </div>
                <div class="status-item">
                    <span>⏱️ Uptime: <strong id="uptime">0:00</strong></span>
                </div>
            </div>
        </header>
        
        <div class="config-panel">
            <div class="config-row">
                <label for="serverUrl">Server URL:</label>
                <input type="text" id="serverUrl" placeholder="ws://192.168.1.100:8765/dashboard" value="ws://localhost:8765/dashboard">
                <button id="connectBtn" class="btn-connect" onclick="toggleConnection()">Connect</button>
            </div>
        </div>
        
        <div class="panels">
            <div class="panel">
                <h2>📡 Latest Reading</h2>
                <div class="stats-grid">
                    <div class="stat-card">
                        <div class="stat-value" id="lastTagId">---</div>
                        <div class="stat-label">Tag ID</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-value" id="lastRssi">---</div>
                        <div class="stat-label">RSSI (dBm)</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-value" id="lastSnr">---</div>
                        <div class="stat-label">SNR</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-value" id="avgRssi">---</div>
                        <div class="stat-label">Avg RSSI</div>
                    </div>
                </div>
                <div style="margin-top: 15px;">
                    <div style="display: flex; justify-content: space-between; font-size: 0.8rem; color: #888;">
                        <span>-100 dBm</span>
                        <span>Signal Strength</span>
                        <span>-20 dBm</span>
                    </div>
                    <div class="rssi-meter">
                        <div class="rssi-bar" id="rssiBar" style="width: 0%"></div>
                    </div>
                </div>
            </div>
            
            <div class="panel">
                <h2>📜 Recent Readings</h2>
                <div class="reading-list" id="readingList">
                    <div style="text-align: center; color: #888; padding: 40px;">
                        No readings yet. Connect to the server to start receiving data.
                    </div>
                </div>
            </div>
        </div>
        
        <div class="panel" style="margin-top: 20px;">
            <h2>📋 Connection Log</h2>
            <div class="log-panel" id="logPanel"></div>
        </div>
    </div>
    
    <script>
        // State
        let ws = null;
        let readings = [];
        let totalReadings = 0;
        let startTime = null;
        let uptimeInterval = null;
        
        // DOM elements
        const statusDot = document.getElementById('statusDot');
        const statusText = document.getElementById('statusText');
        const connectBtn = document.getElementById('connectBtn');
        const serverUrlInput = document.getElementById('serverUrl');
        const totalReadingsEl = document.getElementById('totalReadings');
        const uptimeEl = document.getElementById('uptime');
        const lastTagId = document.getElementById('lastTagId');
        const lastRssi = document.getElementById('lastRssi');
        const lastSnr = document.getElementById('lastSnr');
        const avgRssi = document.getElementById('avgRssi');
        const rssiBar = document.getElementById('rssiBar');
        const readingList = document.getElementById('readingList');
        const logPanel = document.getElementById('logPanel');
        
        function log(message, level = 'info') {
            const time = new Date().toLocaleTimeString();
            const entry = document.createElement('div');
            entry.className = `log-entry ${level}`;
            entry.textContent = `[${time}] ${message}`;
            logPanel.insertBefore(entry, logPanel.firstChild);
            
            // Keep only last 50 log entries
            while (logPanel.children.length > 50) {
                logPanel.removeChild(logPanel.lastChild);
            }
        }
        
        function setStatus(status) {
            statusDot.className = `status-dot ${status}`;
            if (status === 'connected') {
                statusText.textContent = 'Connected';
                connectBtn.textContent = 'Disconnect';
                connectBtn.className = 'btn-disconnect';
                serverUrlInput.disabled = true;
            } else if (status === 'connecting') {
                statusText.textContent = 'Connecting...';
            } else {
                statusText.textContent = 'Disconnected';
                connectBtn.textContent = 'Connect';
                connectBtn.className = 'btn-connect';
                serverUrlInput.disabled = false;
            }
        }
        
        function getRssiClass(rssi) {
            if (rssi >= -50) return 'excellent';
            if (rssi >= -60) return 'good';
            if (rssi >= -70) return 'fair';
            return 'poor';
        }
        
        function getRssiPercent(rssi) {
            // Map -100 to -20 dBm to 0-100%
            return Math.max(0, Math.min(100, ((rssi + 100) / 80) * 100));
        }
        
        function formatTime(timestamp) {
            try {
                const date = new Date(timestamp);
                return date.toLocaleTimeString();
            } catch {
                return timestamp;
            }
        }
        
        function updateStats() {
            totalReadingsEl.textContent = totalReadings;
            
            if (readings.length > 0) {
                const sum = readings.reduce((a, b) => a + b.rssi, 0);
                const avg = Math.round(sum / readings.length);
                avgRssi.textContent = avg;
            }
        }
        
        function updateUptime() {
            if (!startTime) return;
            const elapsed = Math.floor((Date.now() - startTime) / 1000);
            const minutes = Math.floor(elapsed / 60);
            const seconds = elapsed % 60;
            uptimeEl.textContent = `${minutes}:${seconds.toString().padStart(2, '0')}`;
        }
        
        function addReading(data) {
            totalReadings++;
            readings.push(data);
            if (readings.length > 100) readings.shift();
            
            // Update latest stats
            lastTagId.textContent = data.tag_id || '---';
            lastRssi.textContent = data.rssi || '---';
            lastSnr.textContent = data.snr || '---';
            
            // Update RSSI bar
            const rssi = data.rssi || -100;
            const percent = getRssiPercent(rssi);
            const rssiClass = getRssiClass(rssi);
            rssiBar.style.width = `${percent}%`;
            rssiBar.className = `rssi-bar ${rssiClass}`;
            
            // Add to reading list
            const item = document.createElement('div');
            item.className = 'reading-item';
            item.innerHTML = `
                <div class="reading-info">
                    <span class="reading-tag">${data.tag_id || 'Unknown'}</span>
                    <span class="reading-time">${formatTime(data.timestamp)}</span>
                </div>
                <div class="reading-rssi ${rssiClass}">${data.rssi} dBm</div>
            `;
            
            // Clear placeholder if present
            if (readingList.querySelector('div[style]')) {
                readingList.innerHTML = '';
            }
            
            readingList.insertBefore(item, readingList.firstChild);
            
            // Keep only last 20 items
            while (readingList.children.length > 20) {
                readingList.removeChild(readingList.lastChild);
            }
            
            updateStats();
        }
        
        function connect() {
            const url = serverUrlInput.value.trim();
            if (!url) {
                log('Please enter a server URL', 'error');
                return;
            }
            
            setStatus('connecting');
            log(`Connecting to ${url}...`);
            
            try {
                ws = new WebSocket(url);
                
                ws.onopen = () => {
                    setStatus('connected');
                    log('Connected to server', 'info');
                    startTime = Date.now();
                    uptimeInterval = setInterval(updateUptime, 1000);
                };
                
                ws.onclose = (event) => {
                    setStatus('disconnected');
                    log(`Disconnected: ${event.reason || 'Connection closed'}`, 'warn');
                    if (uptimeInterval) clearInterval(uptimeInterval);
                };
                
                ws.onerror = (error) => {
                    log('WebSocket error', 'error');
                    console.error(error);
                };
                
                ws.onmessage = (event) => {
                    try {
                        const message = JSON.parse(event.data);
                        
                        if (message.type === 'connected') {
                            log(`Server: ${message.message}`, 'info');
                        } else if (message.type === 'reading') {
                            addReading(message.data);
                        } else if (message.tag_id || message.rssi !== undefined) {
                            // Direct reading format
                            addReading(message);
                        }
                    } catch (e) {
                        console.error('Parse error:', e);
                    }
                };
            } catch (e) {
                log(`Connection error: ${e.message}`, 'error');
                setStatus('disconnected');
            }
        }
        
        function disconnect() {
            if (ws) {
                ws.close();
                ws = null;
            }
            setStatus('disconnected');
            if (uptimeInterval) clearInterval(uptimeInterval);
        }
        
        function toggleConnection() {
            if (ws && ws.readyState === WebSocket.OPEN) {
                disconnect();
            } else {
                connect();
            }
        }
        
        // Auto-connect if URL has hash with server address
        if (window.location.hash) {
            serverUrlInput.value = decodeURIComponent(window.location.hash.slice(1));
        }
        
        // Enter key to connect
        serverUrlInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') toggleConnection();
        });
        
        log('Dashboard ready. Enter server URL and click Connect.');
    </script>
</body>
</html>
