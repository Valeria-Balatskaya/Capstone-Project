name: lorawan_mobile_app
description: "LoraTrack - Indoor Position Tracking Using LoRaWAN"

publish_to: 'none'

version: 2.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  
  # Firebase
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  
  # Maps & Location
  google_maps_flutter: ^2.6.0
  flutter_map: ^7.0.0
  latlong2: ^0.9.0
  geolocator: ^10.1.0
  
  # Charts & Visualization
  fl_chart: ^0.68.0
  
  # Notifications
  flutter_local_notifications: ^17.0.0
  
  # Storage & Utils
  shared_preferences: ^2.2.2
  http: ^1.1.0
  intl: ^0.19.0
  
  # Sensors
  pedometer: ^4.0.1
  
  # UI
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
